title: "Steam connection logs"
type: logs
streams:
  - input: filestream
    title: Steam connection logs
    description: Collect the connection log the Steam client writes for connection manager connectivity and health checks.
    template_path: filestream.yml.hbs
    vars:
      - name: paths
        type: text
        title: Paths
        description: >-
          Full paths to `connection_log.txt` inside the Steam client's `logs` directory. The defaults cover the default install location on Windows, Linux and macOS. Change them if Steam is installed elsewhere; on Windows the install directory is recorded in the registry at `HKCU\Software\Valve\Steam\SteamPath` and is frequently moved to another drive. Match only `*_log.txt`: Steam rotates by renaming the active file to `*_log.previous.txt`, so collecting both would ingest every line twice.
        multi: true
        required: true
        show_user: true
        default:
          - 'C:\Program Files (x86)\Steam\logs\connection_log.txt'
          - '/home/*/.steam/steam/logs/connection_log.txt'
          - '/home/*/.local/share/Steam/logs/connection_log.txt'
          - '/Users/*/Library/Application Support/Steam/logs/connection_log.txt'
      - name: exclude_files
        type: text
        title: Exclude Files
        description: >-
          Regular expressions matched against the full file path. Matching files are not collected. The default guards against Steam's rotated `*_log.previous.txt` files, which would otherwise double-ingest every line.
        multi: true
        required: false
        show_user: true
        default:
          - '\.previous\.txt$'
          - '\.gz$'
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        multi: false
        required: true
        show_user: true
        default: false
      - name: tags
        type: text
        title: Tags
        description: Tags to include in the published event.
        multi: true
        required: true
        show_user: false
        default:
          - steam-connection
      - name: processors
        type: yaml
        title: Processors
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the logs are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details. The integration always applies `add_locale` ahead of these so that the collecting host's timezone is recorded in `event.timezone`; Steam writes local timestamps with no offset and the ingest pipeline needs it to resolve them.
        multi: false
        required: false
        show_user: false
      - name: condition
        type: text
        title: Condition
        description: >-
          Condition to evaluate before collecting this input, for example `${host.platform} == 'windows'`. Useful for restricting collection to the platforms where Steam is actually installed. See [Dynamic Input Configuration](https://www.elastic.co/guide/en/fleet/current/dynamic-input-configuration.html) for details.
        multi: false
        required: false
        show_user: false
      - name: custom
        type: yaml
        title: Additional Filestream Configuration Options
        description: >-
          Additional filestream options appended to the generated input configuration. See the [Filebeat documentation](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-input-filestream.html) for the full list. Be careful, this may break the integration.
        multi: false
        required: false
        show_user: false
        default: |-
          #encoding: plain
          #prospector.scanner.check_interval: 10s
          #prospector.scanner.fingerprint.enabled: false
          #prospector.scanner.symlinks: true
          #ignore_older: 0
          #close.on_state_change.inactive: 5m
          #clean_removed: true
          #harvester_limit: 0
          #message_max_bytes: 10485760
elasticsearch:
  index_template:
    mappings:
      subobjects: false
