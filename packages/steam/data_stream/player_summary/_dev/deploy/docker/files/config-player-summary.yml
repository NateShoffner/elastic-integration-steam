rules:
  # An invalid Steam Web API key is rejected with HTTP 403 and an HTML body,
  # not JSON. Driven with key=invalid-api-key so the CEL error path can be
  # exercised without disturbing the system test, which sends a valid key.
  - path: /ISteamUser/GetPlayerSummaries/v2/
    methods: ['GET']
    query_params:
      key: 'invalid-api-key'
      steamids: '{steamids:.*}'
    responses:
      - status_code: 403
        headers:
          Content-Type:
            - 'text/html; charset=UTF-8'
        body: |-
          <html><head><title>Forbidden</title></head><body><h1>Forbidden</h1>Access is denied. Retrying will not help. Please verify your <pre>key=</pre> parameter.</body></html>
  # A malformed steamid is NOT rejected by this endpoint, unlike the
  # per-account IPlayerService ones: the live API answers HTTP 200 with an
  # empty players array, exactly as for an ID that resolves to no account.
  - path: /ISteamUser/GetPlayerSummaries/v2/
    methods: ['GET']
    query_params:
      key: '{key:.*}'
      steamids: 'not-a-steamid'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json; charset=UTF-8'
        body: '{"response":{"players":[]}}'
  # A SteamID64 that does not resolve to an account is not an error: the call
  # succeeds and the player is simply absent from the list, so a batch made up
  # entirely of such IDs comes back with an empty players array.
  - path: /ISteamUser/GetPlayerSummaries/v2/
    methods: ['GET']
    query_params:
      key: '{key:.*}'
      steamids: '76561197971489999'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json; charset=UTF-8'
        body: '{"response":{"players":[]}}'
  # Steady state. Catch-all on key and steamids so any batch of IDs the program
  # sends matches, including the second and later batches of a chunked walk.
  # Two response bodies are defined and the server alternates between them, so
  # a repeat poll always observes changed presence state. Every single response
  # on its own still covers all of: several players in one response, a public
  # profile and a private one, a player in a game and a player not in one.
  #   ...072  public, in Team Fortress 2   <-> public, not in a game
  #   ...073  public, not in a game        <-> public, in Counter-Strike 2
  #                                             with gameserverip 0.0.0.0:0
  #   ...074  private (communityvisibilitystate 1), reduced field set,
  #           unchanged between snapshots
  #
  # The private player's field set is the one observed on the live API for a
  # private profile: lastlogoff, personastateflags and commentpermission are
  # still present, while primaryclanid, timecreated, realname and the loc*
  # fields are not. Non-public profiles of accounts that are not friends of the
  # key owner have also been observed as communityvisibilitystate 2 with an
  # even smaller set, without lastlogoff or personastateflags; the pipeline
  # tolerates every one of these fields being absent.
  - path: /ISteamUser/GetPlayerSummaries/v2/
    methods: ['GET']
    query_params:
      key: '{key:.*}'
      steamids: '{steamids:.*}'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json; charset=UTF-8'
        body: |-
          {{ minify_json `
          {
            "response": {
              "players": [
                {
                  "steamid": "76561197971489072",
                  "communityvisibilitystate": 3,
                  "profilestate": 1,
                  "personaname": "example_player",
                  "profileurl": "https://steamcommunity.com/id/example_player/",
                  "avatar": "https://avatars.steamstatic.com/1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d.jpg",
                  "avatarmedium": "https://avatars.steamstatic.com/1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d_medium.jpg",
                  "avatarfull": "https://avatars.steamstatic.com/1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d_full.jpg",
                  "avatarhash": "1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d",
                  "lastlogoff": 1772000000,
