title: "Steam player summaries"
type: metrics
streams:
  - input: cel
    title: Steam player summaries
    description: >-
      Poll `ISteamUser/GetPlayerSummaries` for a presence snapshot of each account listed in the `steam_ids` setting of this integration: persona name, online state, and the game being played. The accounts, the API key and the API URL are shared with the other Steam Web API data streams and are configured once on the integration.
    template_path: cel.yml.hbs
    vars:
      - name: interval
        type: text
        title: Interval
        description: >-
          How often the Steam Web API is polled, as a duration. Each poll is a complete snapshot of every configured account, since this endpoint has no incremental filter. One request covers up to 100 accounts, so with fewer than 100 accounts a 5 minute interval is roughly 300 of the 100,000 calls a key is allowed per day. Presence changes faster than that, so shorten the interval if you want a finer picture of who is in a game; multiply the call count by the number of 100 account batches before doing so.
        multi: false
        required: true
        show_user: true
        default: 5m
      - name: http_client_timeout
        type: text
        title: HTTP client timeout
        description: Duration before a request to the Steam Web API is abandoned.
        multi: false
        required: false
        show_user: false
        default: 30s
      - name: preserve_original_event
        type: bool
        title: Preserve original event
        description: Preserves a raw copy of the original event, added to the field `event.original`.
        multi: false
        required: true
        show_user: true
        default: false
      - name: tags
        type: text
        title: Tags
        description: Tags to include in the published event.
        multi: true
        required: true
        show_user: false
        default:
          - steam-player-summary
      - name: processors
        type: yaml
        title: Processors
        description: >-
          Processors are used to reduce the number of fields in the exported event or to enhance the event with metadata. This executes in the agent before the events are parsed. See [Processors](https://www.elastic.co/guide/en/beats/filebeat/current/filtering-and-enhancing-data.html) for details.
        multi: false
        required: false
        show_user: false
      - name: enable_request_tracer
        type: bool
        title: Enable request tracer
        description: >-
          Log every request and response to `../../logs/cel/http-request-trace-*.ndjson` for troubleshooting. The API key is redacted, but traces are verbose and should not be left enabled.
        multi: false
        required: false
        show_user: false
        default: false
      - name: proxy_url
        type: text
        title: Proxy URL
        description: URL of the proxy to use when reaching the Steam Web API, including the scheme.
        multi: false
        required: false
        show_user: false
      - name: ssl
        type: yaml
        title: SSL configuration
        description: >-
          TLS settings for the connection to the Steam Web API. See [SSL](https://www.elastic.co/guide/en/beats/filebeat/current/configuration-ssl.html) for details.
        multi: false
        required: false
        show_user: false
elasticsearch:
  source_mode: synthetic
  index_mode: time_series
  index_template:
    mappings:
      subobjects: false
