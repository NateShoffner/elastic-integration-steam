# Keeps the most recent name the Steam Web API reported for each Steam
# application, so dashboards built on the client logs, which only record
# application IDs, can show game names with ES|QL LOOKUP JOIN.
#
# The version suffix on dest.index must be incremented for any breaking change
# to the destination mappings or settings, together with fleet_transform_version,
# and the dashboards that join against it updated to match. The old destination
# index is not removed automatically.
source:
  index:
    - "metrics-steam.owned_game-*"
    - "metrics-steam.recently_played-*"
    - "metrics-steam.player_summary-*"
  query:
    bool:
      filter:
        - exists:
            field: steam.app.name
        # Each checkpoint re-aggregates every changed application over the
        # whole source, so only look at recent polls. Entries for applications
        # not reported since are kept, not removed.
        - range:
            "@timestamp":
              gte: now-30d
      must_not:
        - exists:
            field: error.message
dest:
  index: "steam_lookup.dest_app_name-1"
  aliases:
    - alias: "steam_lookup.app_name"
      move_on_creation: true
# A pivot rather than a latest transform so each document holds only the join
# key and the name: a latest transform copies the whole source document, and
# Fleet does not allow uploaded packages to ship the ingest pipeline that would
# strip it. Application names are global, so every account and namespace that
# reports an application contributes to the same single entry.
pivot:
  group_by:
    steam.app.id:
      terms:
        field: steam.app.id
  aggregations:
    # The most recently reported name, written straight to steam.app.name.
    steam.app.name:
      scripted_metric:
        init_script: "state.ts = -1L; state.name = null;"
        map_script: >-
          if (doc['steam.app.name'].size() > 0) {
            long t = doc['@timestamp'].value.toInstant().toEpochMilli();
            if (t > state.ts) { state.ts = t; state.name = doc['steam.app.name'].value; }
          }
        combine_script: "return state;"
        reduce_script: >-
          long ts = -1L; String name = null;
          for (s in states) { if (s != null && s.name != null && s.ts > ts) { ts = s.ts; name = s.name; } }
          return name;
description: >-
  Latest name reported by the Steam Web API for each Steam application, kept in a lookup index so client log data,
  which only records application IDs, can be enriched with game names using ES|QL LOOKUP JOIN on steam.app.id.
frequency: 5m
sync:
  time:
    field: "@timestamp"
    delay: 120s
settings:
  # Prevents the transform from replacing the Fleet-managed mappings.
  deduce_mappings: false
  unattended: true
_meta:
  managed: false
  # Bump to delete, reinstall and restart the transform on package upgrade.
  fleet_transform_version: 0.1.0
  run_as_kibana_system: false
